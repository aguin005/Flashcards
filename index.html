<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recall: a private, local-first study app for flashcards, quizzes, and vocabulary from your PDFs." />
    <meta name="theme-color" content="#4a49f0" />
    <title>Recall · Study</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('recall:prefs');
          var theme = raw ? JSON.parse(raw).theme : 'system';
          var dark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Recall needs JavaScript to run. Everything stays in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
